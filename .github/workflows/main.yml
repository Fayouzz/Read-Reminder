name: Build debug APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Unit tests (a failure here does not block the APK)
        continue-on-error: true
        working-directory: ReadReminder
        run: gradle testDebugUnitTest --no-daemon --stacktrace
      - name: Build APK
        working-directory: ReadReminder
        run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ReadReminder-debug-apk
          path: ReadReminder/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-report
          path: ReadReminder/app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
